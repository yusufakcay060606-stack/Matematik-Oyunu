<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="eqGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="eqGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.18"/>
    </filter>
  </defs>

  <g filter="url(#dropShadow)">
    <!-- Sol Taraf: 2x (Yeşil Vurgulu) -->
    <text x="24" y="68" font-family="'Comic Sans MS', 'Fredoka', 'Quicksand', 'Arial Rounded MT Bold', system-ui, sans-serif" font-size="52" font-weight="900" fill="url(#eqGrad1)">2x</text>

    <!-- Artı İşareti: + (Mavi) -->
    <text x="92" y="66" font-family="'Arial Rounded MT Bold', system-ui, sans-serif" font-size="44" font-weight="900" fill="#0284c7">+</text>

    <!-- Sabit Terim: 5 (Turuncu) -->
    <text x="122" y="68" font-family="'Comic Sans MS', 'Fredoka', 'Quicksand', system-ui, sans-serif" font-size="48" font-weight="900" fill="url(#eqGrad2)">5</text>

    <!-- Eşittir İşareti ve Bilinmeyen x=? Alanı -->
    <rect x="22" y="92" width="40" height="10" rx="5" fill="#64748b" />
    <rect x="22" y="112" width="40" height="10" rx="5" fill="#64748b" />

    <!-- x=? Rozeti -->
    <rect x="74" y="86" width="70" height="42" rx="12" fill="#d1fae5" stroke="#10b981" stroke-width="3.5" />
    <text x="82" y="116" font-family="'Comic Sans MS', 'Fredoka', system-ui, sans-serif" font-size="28" font-weight="900" fill="#047857">x=?</text>
  </g>
</svg>
